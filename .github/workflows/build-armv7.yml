name: Build armv7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frontend artifact
        uses: ./.github/actions/build-frontend
        with:
          artifact-name: komari-frontend

      - name: Restore frontend
        uses: ./.github/actions/restore-frontend

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install Zig
        uses: ./.github/actions/setup-zig

      - name: Build armv7
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
          CGO_ENABLED: "1"
          CC: zig cc -target arm-linux-musleabihf
          GIN_MODE: release
        run: |
          go build -trimpath -ldflags="-s -w -X github.com/komari-monitor/komari/utils.CurrentVersion=1.6.0-armv7" -o komari-linux-armv7

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: komari-linux-armv7
          path: komari-linux-armv7