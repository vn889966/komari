name: Build armv7

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frontend artifact
        uses: ./.github/actions/build-frontend
        with:
          artifact-name: komari-frontend

      - name: Restore frontend
        uses: ./.github/actions/restore-frontend

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install Zig
        uses: ./.github/actions/setup-zig

      - name: Build armv7
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
          CGO_ENABLED: "1"
          CC: zig cc -target arm-linux-musleabihf
          GIN_MODE: release
        run: |
          go build -trimpath -ldflags="-s -w -X github.com/komari-monitor/komari/utils.CurrentVersion=1.6.0-armv7" -o komari-linux-armv7
          chmod +x komari-linux-armv7

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create armv7-1.6.0 komari-linux-armv7 --repo "$GITHUB_REPOSITORY" --title "armv7 1.6.0" --notes "armv7 build for OneThing WKY" || gh release upload armv7-1.6.0 komari-linux-armv7 --repo "$GITHUB_REPOSITORY" --clobber